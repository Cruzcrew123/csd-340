<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bioSite | Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <h1>bioSite</h1>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="hobbies.html">Hobbies</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <section class="page-title">
      <p class="eyebrow">Get in Touch</p>
      <h2>Contact Page</h2>
      <p>This page includes a basic contact section and form layout for the bioSite project.</p>
    </section>

    <section class="contact-layout">
      <article class="card">
        <h3>Contact Information</h3>
        <p><strong>Email:</strong> example@email.com</p>
        <p><strong>Location:</strong> Your City, State</p>
        <p><strong>External Link:</strong> <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Visit GitHub</a></p>
      </article>

      <form class="contact-form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here"></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 bioSite Project | Contact Page</p>
    </div>
  </footer>
</body>
</html>
